name: Create Release Package

on:
  push:
    tags:
      - 'v*.*.*'

# Three jobs, so the signing key never shares a machine with third-party code:
#
#   build-release    composer/npm install + build + package. NO secrets, read-only token.
#   sign-release     fresh runner, no Composer/npm: signs the package (and any
#                    migration patch) with PLUGIN_SIGNING_KEY via the dependency-free
#                    bin/release-sign.php. Runs in the `release-signing` environment so
#                    the key can be scoped there with protection rules (GitHub settings).
#   publish-release  verifies the signature against the COMMITTED public key, then
#                    creates the GitHub Release (contents: write) and re-verifies the upload.
#
# Default token scope is read-only; only publish-release raises it to write.
permissions:
  contents: read

jobs:
  build-release:
    name: Build and Package Release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.VERSION }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          # composer.json requires ^8.2 — build the package with the app's
          # minimum supported PHP so the optimized autoloader stays compatible.
          php-version: '8.2'
          extensions: pdo, pdo_mysql, pdo_sqlite, mbstring, json, openssl, curl, gd, exif
          tools: composer

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq rsync zip unzip

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Install NPM dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Verify version.json matches tag
        run: |
          VERSION_JSON=$(jq -r '.version' version.json)
          if [ "$VERSION_JSON" != "${{ steps.version.outputs.VERSION }}" ]; then
            echo "❌ Version mismatch: version.json ($VERSION_JSON) != tag (${{ steps.version.outputs.VERSION }})"
            exit 1
          fi
          echo "✅ Version verified: $VERSION_JSON"

      - name: Make build script executable
        run: chmod +x bin/build-release.sh

      - name: Create release package
        run: ./bin/build-release.sh --skip-build

      - name: Verify package files exist
        run: |
          if [ ! -f "releases/cimaise-v${{ steps.version.outputs.VERSION }}.zip" ]; then
            echo "❌ Release ZIP not found"
            exit 1
          fi
          if [ ! -f "releases/cimaise-v${{ steps.version.outputs.VERSION }}.zip.sha256" ]; then
            echo "❌ Checksum file not found"
            exit 1
          fi
          if [ ! -f "releases/RELEASE_NOTES-v${{ steps.version.outputs.VERSION }}.md" ]; then
            echo "❌ Release notes not found"
            exit 1
          fi
          echo "✅ All package files verified"

      # Optional per-release migration patches (release-patches/*.php) travel as
      # standalone release assets; they are SIGNED in sign-release, not here.
      - name: Stage release patches (optional)
        run: |
          set -euo pipefail
          for name in pre-update-patch.php post-install-patch.php; do
            if [ -f "release-patches/${name}" ]; then
              cp "release-patches/${name}" "releases/${name}"
              echo "Staged ${name}"
            fi
          done

      - name: Hand the unsigned package to the signing job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-release
          path: |
            releases/cimaise-v${{ steps.version.outputs.VERSION }}.zip
            releases/cimaise-v${{ steps.version.outputs.VERSION }}.zip.sha256
            releases/RELEASE_NOTES-v${{ steps.version.outputs.VERSION }}.md
            releases/pre-update-patch.php
            releases/post-install-patch.php
          if-no-files-found: error
          retention-days: 1

  sign-release:
    name: Sign release package
    needs: build-release
    runs-on: ubuntu-24.04
    # Create this environment in Settings → Environments, move the
    # PLUGIN_SIGNING_KEY secret into it and restrict it to `v*` tags (and,
    # optionally, required reviewers). Until then the repository secret is used.
    environment: release-signing
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.build-release.outputs.version }}

    steps:
      # Only first-party files are used here: app/Support/PluginSignature.php,
      # bin/release-sign.php and resources/keys/plugin-signing.pub. No
      # composer/npm install — nothing third-party runs next to the key.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP 8.2 (sodium only)
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          extensions: sodium
          tools: none
          coverage: none

      - name: Download unsigned package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-release
          path: releases

      - name: Check package against its sha256 sidecar
        working-directory: releases
        run: sha256sum -c "cimaise-v${VERSION}.zip.sha256"

      # FAIL-CLOSED: from Updater::PACKAGE_SIGNATURE_REQUIRED_FROM on, installs
      # refuse an unsigned package, so a release without the key must not ship.
      # release-sign.php also checks the fresh signature against the committed
      # public key (a mismatched secret fails here, not on users' sites).
      - name: Sign package and patches
        env:
          PLUGIN_SIGNING_KEY: ${{ secrets.PLUGIN_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${PLUGIN_SIGNING_KEY:-}" ]; then
            echo "::error::PLUGIN_SIGNING_KEY is not configured — refusing to publish an unsigned release"
            exit 1
          fi
          php bin/release-sign.php package "releases/cimaise-v${VERSION}.zip" "${VERSION}"
          for name in pre-update-patch.php post-install-patch.php; do
            if [ -f "releases/${name}" ]; then
              php bin/release-sign.php patch "releases/${name}" "${VERSION}"
            fi
          done

      - name: Hand the signatures to the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-signatures
          path: releases/*.sig
          if-no-files-found: error
          retention-days: 1

  publish-release:
    name: Publish GitHub Release
    needs: [build-release, sign-release]
    runs-on: ubuntu-24.04
    # Creating the release and uploading assets requires contents write.
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build-release.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP 8.2 (sodium only)
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          extensions: sodium
          tools: none
          coverage: none

      - name: Download package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-release
          path: releases

      - name: Download signatures
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-signatures
          path: releases

      - name: Verify package signature against the committed public key
        run: php bin/release-sign.php verify-package "releases/cimaise-v${VERSION}.zip" "${VERSION}"

      - name: Extract changelog for this version
        id: changelog
        run: |
          if [ -f "CHANGELOG.md" ]; then
            # Extract changelog section for this version
            VERSION_SECTION=$(awk "/## \[${VERSION}\]/{flag=1;next}/## \[/{flag=0}flag" CHANGELOG.md || echo "See CHANGELOG.md for details")
            {
              echo "CHANGELOG<<EOF"
              echo "$VERSION_SECTION"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "CHANGELOG=See release notes for details" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: Cimaise v${{ needs.build-release.outputs.version }}
          body: |
            # Cimaise v${{ needs.build-release.outputs.version }}

            ${{ steps.changelog.outputs.CHANGELOG }}

            ---

            ## 📦 Download

            Download `cimaise-v${{ needs.build-release.outputs.version }}.zip` and verify checksum:

            ```bash
            shasum -a 256 -c cimaise-v${{ needs.build-release.outputs.version }}.zip.sha256
            ```

            The package is also signed with the project's Ed25519 key (`cimaise-v${{ needs.build-release.outputs.version }}.zip.sig`); the built-in updater verifies that signature before installing.

            ## 📋 Installation

            1. Extract archive:
               ```bash
               unzip cimaise-v${{ needs.build-release.outputs.version }}.zip
               cd cimaise-v${{ needs.build-release.outputs.version }}
               ```

            2. Configure environment:
               ```bash
               cp .env.example .env
               # Edit .env with your settings
               ```

            3. Run web installer at: http://yourdomain.com

            4. *(Optional)* Refresh Composer dependencies if customizing:
               ```bash
               composer install --no-dev --optimize-autoloader
               ```

            See README.md in the package for complete documentation.
          files: |
            releases/cimaise-v${{ needs.build-release.outputs.version }}.zip
            releases/cimaise-v${{ needs.build-release.outputs.version }}.zip.sha256
            releases/cimaise-v${{ needs.build-release.outputs.version }}.zip.sig
            releases/RELEASE_NOTES-v${{ needs.build-release.outputs.version }}.md
            releases/pre-update-patch.php
            releases/pre-update-patch.php.sig
            releases/post-install-patch.php
            releases/post-install-patch.php.sig
          # The patch assets are optional (present only when this release ships
          # a migration patch); don't fail the release when they're absent. The
          # package .sig is checked explicitly in the verification step below.
          fail_on_unmatched_files: false
          draft: false
          # Pinakes rule: hyphenated versions (1.5.0-rc.1) are prereleases, so
          # /releases/latest never resolves to them and stable installs are safe.
          prerelease: ${{ contains(needs.build-release.outputs.version, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Pinakes "absolute rule" adapted to Actions: NEVER trust that the upload
      # worked. Verify the published asset via the GitHub API (metadata + binary
      # re-download) against the locally built package, and fail loudly otherwise.
      - name: Verify uploaded release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ASSET_NAME="cimaise-v${VERSION}.zip"
          LOCAL_FILE="releases/${ASSET_NAME}"

          LOCAL_SHA=$(sha256sum "$LOCAL_FILE" | awk '{print $1}')
          LOCAL_SIZE=$(stat -c%s "$LOCAL_FILE")
          echo "Local package: ${LOCAL_SIZE} bytes, sha256=${LOCAL_SHA}"

          # 1) Release metadata via API (authoritative answer, no CDN).
          #    Retry a few times: asset processing can lag right after upload.
          RELEASE_JSON=""
          for attempt in 1 2 3 4 5; do
            if RELEASE_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v${VERSION}"); then
              break
            fi
            echo "Attempt ${attempt}: release not available yet, retrying in 10s..."
            sleep 10
          done
          if [ -z "$RELEASE_JSON" ]; then
            echo "::error::Cannot fetch release v${VERSION} via API"
            exit 1
          fi

          ASSET_JSON=$(echo "$RELEASE_JSON" | jq --arg n "$ASSET_NAME" '[.assets[] | select(.name == $n)] | first // empty')
          if [ -z "$ASSET_JSON" ]; then
            echo "::error::Release v${VERSION} has NO ${ASSET_NAME} asset - the upload failed. Installs would have nothing to download."
            exit 1
          fi

          REMOTE_SIZE=$(echo "$ASSET_JSON" | jq -r '.size')
          REMOTE_DIGEST=$(echo "$ASSET_JSON" | jq -r '.digest // empty')
          ASSET_ID=$(echo "$ASSET_JSON" | jq -r '.id')
          echo "Remote asset: id=${ASSET_ID}, ${REMOTE_SIZE} bytes, digest=${REMOTE_DIGEST:-<none>}"

          if [ "$REMOTE_SIZE" != "$LOCAL_SIZE" ]; then
            echo "::error::Uploaded asset size (${REMOTE_SIZE}) != local package size (${LOCAL_SIZE}) - truncated upload"
            exit 1
          fi

          if [ -n "$REMOTE_DIGEST" ] && [ "$REMOTE_DIGEST" != "sha256:${LOCAL_SHA}" ]; then
            echo "::error::Uploaded asset digest (${REMOTE_DIGEST}) != local sha256:${LOCAL_SHA}"
            exit 1
          fi

          # 2) Re-download the binary via the API and compare checksums.
          gh api -H "Accept: application/octet-stream" \
            "repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}" > /tmp/asset-redownload.zip
          DL_SHA=$(sha256sum /tmp/asset-redownload.zip | awk '{print $1}')
          if [ "$DL_SHA" != "$LOCAL_SHA" ]; then
            echo "::error::Re-downloaded asset sha256 (${DL_SHA}) != local sha256 (${LOCAL_SHA})"
            exit 1
          fi

          # 3) The .sha256 sidecar must also be present (runtime fallback integrity source).
          if ! echo "$RELEASE_JSON" | jq -e --arg n "${ASSET_NAME}.sha256" '.assets[] | select(.name == $n)' > /dev/null; then
            echo "::error::Release is missing the ${ASSET_NAME}.sha256 sidecar asset"
            exit 1
          fi

          # 4) The publisher signature must be published, and the PUBLISHED
          #    .sig must verify the RE-DOWNLOADED package — exactly what the
          #    updater on every install will check.
          SIG_ID=$(echo "$RELEASE_JSON" | jq -r --arg n "${ASSET_NAME}.sig" '[.assets[] | select(.name == $n)] | first | .id // empty')
          if [ -z "$SIG_ID" ]; then
            echo "::error::Release is missing the ${ASSET_NAME}.sig publisher signature — signed-era installs would refuse this update"
            exit 1
          fi
          gh api -H "Accept: application/octet-stream" \
            "repos/${GITHUB_REPOSITORY}/releases/assets/${SIG_ID}" > /tmp/asset-redownload.zip.sig
          php bin/release-sign.php verify-package /tmp/asset-redownload.zip "${VERSION}" /tmp/asset-redownload.zip.sig

          echo "Uploaded asset verified: name, size, digest, binary checksum and publisher signature all match."

      - name: Upload release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-package-v${{ needs.build-release.outputs.version }}
          path: |
            releases/cimaise-v${{ needs.build-release.outputs.version }}.zip
            releases/cimaise-v${{ needs.build-release.outputs.version }}.zip.sha256
            releases/cimaise-v${{ needs.build-release.outputs.version }}.zip.sig
            releases/RELEASE_NOTES-v${{ needs.build-release.outputs.version }}.md
          retention-days: 90
