# ───────────────────────────────────────────────────────────────────────────
# Cimaise — Apache virtual host (container image)
#
# DocumentRoot is public/ so only the web entrypoint is reachable. AllowOverride
# All keeps the project's .htaccess fully in effect inside the container exactly
# like on shared hosting (rewrite to index.php, security headers, dotfile and
# traversal blocks, header de-duplication) — this is the project's expected
# runtime contract.
# ───────────────────────────────────────────────────────────────────────────
<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php
    </Directory>

    # Never serve the application code, storage or database directory.
    <DirectoryMatch "^/var/www/html/(app|storage|database|vendor|bin|resources|scripts|tests)">
        Require all denied
    </DirectoryMatch>

    # Behind a TLS-terminating reverse proxy, set TRUSTED_PROXIES in the
    # environment: the app then honours X-Forwarded-Proto/-Host/-For from those
    # peers only (TrustedProxyMiddleware, CookieHelper, ClientIp). Apache must
    # not map X-Forwarded-Proto to HTTPS=on itself: it would trust the header
    # from any client that reaches the container directly.

    ErrorLog  /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
